[project]
name = "energy-commodity-var-engine"
version = "1.0.0"
description = "Energy futures market-risk analytics with VaR, Expected Shortfall, stress testing, attribution, and model validation"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Akila Juan"}]
keywords = [
  "market-risk",
  "value-at-risk",
  "expected-shortfall",
  "energy-trading",
  "commodities",
  "futures",
  "model-validation",
  "stress-testing",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
