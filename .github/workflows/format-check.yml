name: Python format check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.11.13
      - run: ruff format --check .
