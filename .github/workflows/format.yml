name: Format Python consistently
on:
  workflow_dispatch:
  push:
    branches: [research-october]
    paths: ['.github/workflows/format.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.11.13
      - run: ruff format .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet || git commit -m "Use consistent Ruff formatting across Python code"
          git push
      - run: ruff format --check .
